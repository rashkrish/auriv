    numbers:
      - kind: police
        number: "110"
      - kind: fire_ambulance
        number: "112"

  ES:
    name: Spain
    languages: [es-ES]
    status: verified
    checked: "2026-10-29"
    source: "https://europa.eu/youreurope/citizens/travel/security-and-emergencies/emergency/index_en.htm (European Union: 112 works free in all EU countries)"
    numbers:
      - kind: emergency
        number: "112"

  IT:
